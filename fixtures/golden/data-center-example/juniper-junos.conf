#
# cidrly Network Configuration
# Plan: Data Center Example
# Generated: <timestamp>
# Base IP: 172.16.0.0
# Supernet: 172.16.0.0/24
#

vlans {
    Web_Tier {
        vlan-id 100;
        l3-interface irb.100;
    }
    Application_Tier {
        vlan-id 110;
        l3-interface irb.110;
    }
    Database_Tier {
        vlan-id 120;
        l3-interface irb.120;
    }
    Storage_Network {
        vlan-id 130;
        l3-interface irb.130;
    }
    Management {
        vlan-id 140;
        l3-interface irb.140;
    }
    Backup_Network {
        vlan-id 150;
        l3-interface irb.150;
    }
}

interfaces {
    irb {
        unit 100 {
            description "Web Tier - 20 devices";
            family inet {
                address 172.16.0.1/26;
            }
        }
        unit 110 {
            description "Application Tier - 30 devices";
            family inet {
                address 172.16.0.65/26;
            }
        }
        unit 120 {
            description "Database Tier - 10 devices";
            family inet {
                address 172.16.0.129/27;
            }
        }
        unit 130 {
            description "Storage Network - 15 devices";
            family inet {
                address 172.16.0.161/27;
            }
        }
        unit 140 {
            description "Management - 8 devices";
            family inet {
                address 172.16.0.193/27;
            }
        }
        unit 150 {
            description "Backup Network - 5 devices";
            family inet {
                address 172.16.0.225/28;
            }
        }
    }
}
