!
! cidrly Network Configuration
! Plan: Data Center Example
! Generated: <timestamp>
! Base IP: 172.16.0.0
! Supernet: 172.16.0.0/24
!

vlan database
vlan 100 name "Web_Tier"
vlan 110 name "Application_Tier"
vlan 120 name "Database_Tier"
vlan 130 name "Storage_Network"
vlan 140 name "Management"
vlan 150 name "Backup_Network"
exit
!
interface vlan 100
ip address 172.16.0.1 255.255.255.192
description "Web Tier - 20 devices"
exit
!
interface vlan 110
ip address 172.16.0.65 255.255.255.192
description "Application Tier - 30 devices"
exit
!
interface vlan 120
ip address 172.16.0.129 255.255.255.224
description "Database Tier - 10 devices"
exit
!
interface vlan 130
ip address 172.16.0.161 255.255.255.224
description "Storage Network - 15 devices"
exit
!
interface vlan 140
ip address 172.16.0.193 255.255.255.224
description "Management - 8 devices"
exit
!
interface vlan 150
ip address 172.16.0.225 255.255.255.240
description "Backup Network - 5 devices"
exit
!
