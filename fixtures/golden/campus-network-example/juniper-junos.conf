#
# cidrly Network Configuration
# Plan: Campus Network Example
# Generated: <timestamp>
# Base IP: 10.100.0.0
# Supernet: 10.100.0.0/21
#

vlans {
    Student_WiFi {
        vlan-id 30;
        l3-interface irb.30;
    }
    Engineering_Building {
        vlan-id 10;
        l3-interface irb.10;
    }
    Science_Lab {
        vlan-id 20;
        l3-interface irb.20;
    }
    Guest_WiFi {
        vlan-id 50;
        l3-interface irb.50;
    }
    Administration {
        vlan-id 40;
        l3-interface irb.40;
    }
}

interfaces {
    irb {
        unit 30 {
            description "Student WiFi - 250 devices";
            family inet {
                address 10.100.0.1/23;
            }
        }
        unit 10 {
            description "Engineering Building - 100 devices";
            family inet {
                address 10.100.2.1/24;
            }
        }
        unit 20 {
            description "Science Lab - 75 devices";
            family inet {
                address 10.100.3.1/24;
            }
        }
        unit 50 {
            description "Guest WiFi - 50 devices";
            family inet {
                address 10.100.4.1/25;
            }
        }
        unit 40 {
            description "Administration - 30 devices";
            family inet {
                address 10.100.4.129/26;
            }
        }
    }
}
