description "Student WiFi - 250 devices"
exit
!
interface vlan 10
ip address 10.100.2.1 255.255.255.0
description "Engineering Building - 100 devices"
exit
!
interface vlan 20
ip address 10.100.3.1 255.255.255.0
description "Science Lab - 75 devices"
exit
!
interface vlan 50
ip address 10.100.4.1 255.255.255.128
description "Guest WiFi - 50 devices"
exit
!
interface vlan 40
ip address 10.100.4.129 255.255.255.192
description "Administration - 30 devices"
exit
!
