description "VoIP Phones - 15 devices"
exit
!
interface vlan 30
ip address 192.168.10.97 255.255.255.224
description "Guest WiFi - 10 devices"
exit
!
interface vlan 40
ip address 192.168.10.129 255.255.255.240
description "Printers - 5 devices"
exit
!
